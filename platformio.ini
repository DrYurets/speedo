[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    olikraus/U8g2@^2.35.30
    mikalhart/TinyGPSPlus@^1.0.3

; Заливка по воздуху: устройство в режиме «Обновление» (меню),
; затем:  pio run -e esp32-c3-ota -t upload
[env:esp32-c3-ota]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
upload_protocol = espota
upload_port = speedo.local
upload_flags =
    --auth=${OTA_PASSWORD}
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    olikraus/U8g2@^2.35.30
    mikalhart/TinyGPSPlus@^1.0.3
