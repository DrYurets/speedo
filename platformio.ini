[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    olikraus/U8g2@^2.35.30
    mikalhart/TinyGPSPlus@^1.0.3

; Демо-экран с тестовыми значениями для проверки вёрстки:
;   pio run -e esp32-c3-demo -t upload
[env:esp32-c3-demo]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DSPEEDO_DEMO=1
lib_deps =
    olikraus/U8g2@^2.35.30
    mikalhart/TinyGPSPlus@^1.0.3

; Заливка по воздуху: устройство в режиме «Обновление» (меню) создаёт
; точку доступа Speedo. Подключиться к ней, затем:
;   OTA_PASSWORD=пароль pio run -e esp32-c3-ota -t upload
[env:esp32-c3-ota]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
upload_protocol = espota
upload_port = 192.168.4.1
upload_flags =
    --auth=${OTA_PASSWORD}
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    olikraus/U8g2@^2.35.30
    mikalhart/TinyGPSPlus@^1.0.3
